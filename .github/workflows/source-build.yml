name: Source build without experiment data
on: [push, pull_request]
permissions:
  contents: read
jobs:
  noetic:
    runs-on: ubuntu-22.04
    container: osrf/ros:noetic-desktop-full-focal
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential cmake pkg-config python3-pip python3-venv python3-opencv python3-pil python3-empy python3-catkin-pkg python3-rospkg libeigen3-dev libpcl-dev libarmadillo-dev libopencv-dev libgazebo11-dev ros-noetic-mavros-msgs ros-noetic-pcl-ros ros-noetic-pcl-conversions ros-noetic-cmake-modules fonts-dejavu-core
      - name: Prepare Python environment
        run: bash scripts/setup_python.sh
      - name: Compile from source
        run: bash scripts/build_sim.sh
      - name: Check source-only entry points
        run: |
          source scripts/environment.sh
          python3 -m unittest tests.test_attack_showcase tests.test_source_distribution tests.test_isolated_waiting
